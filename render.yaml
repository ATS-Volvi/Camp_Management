services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js / Express + Neon PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: camp-management-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOW_ORIGIN
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (Vite + React SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: camp-management-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
