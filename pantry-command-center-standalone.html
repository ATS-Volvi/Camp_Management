      { id: "dish_mutton_potato", name: "Aloo Gosht Stew", mealSession: "Dinner", scheduledDay: "Day +2", portions: 920, keyIngredientIds: ["lamb", "potatoes", "onions", "tomatoes", "cooking_oil"] },
      { id: "dish_egg_fried_rice", name: "Egg Fried Rice", mealSession: "Lunch", scheduledDay: "Day +3", portions: 800, keyIngredientIds: ["eggs", "rice", "cooking_oil", "onions"] },
      { id: "dish_sayadieh", name: "Traditional Fish Sayadieh", mealSession: "Dinner", scheduledDay: "Day +3", portions: 780, keyIngredientIds: ["fish", "rice", "onions", "spices", "cooking_oil"] },
      { id: "dish_pancakes", name: "Camp Breakfast Pancakes", mealSession: "Breakfast", scheduledDay: "Day +3", portions: 950, keyIngredientIds: ["eggs", "milk", "flour", "cooking_oil"] },
    ];

    // ========================================================================
    // SIMULATION ENGINE
    // ========================================================================
    function calculateSimulation(daysAhead, whatIfs) {
      const workerMultiplier = whatIfs.extraWorkers200 ? 1.2 : 1.0;

      const ingredients = PANTRY_DATA.map((item) => {
        let ramadanMultiplier = 1.0;
        if (whatIfs.ramadanMode) {
          if (["rice", "cooking_oil", "lentils", "spices"].includes(item.id)) ramadanMultiplier = 1.35;
          else if (["lamb", "chicken"].includes(item.id)) ramadanMultiplier = 1.25;
        }

        const effectiveUsage = Number((item.avgDailyUsage * workerMultiplier * ramadanMultiplier).toFixed(1));
        const remainingStock = Math.max(0, Number((item.currentStock - effectiveUsage * daysAhead).toFixed(1)));
        const daysOfCoverLeft = effectiveUsage > 0 ? Number((remainingStock / effectiveUsage).toFixed(1)) : 99;
        const effectiveThreshold = item.thresholdDays + (whatIfs.delayDelivery3Days ? 3 : 0);

        let status = "green";
        if (daysOfCoverLeft < effectiveThreshold) status = "red";
        else if (daysOfCoverLeft <= effectiveThreshold + 2.0) status = "amber";

        const totalDays = effectiveUsage > 0 ? item.currentStock / effectiveUsage : 99;
        const daysUntilExhausted = Math.max(0, Number((totalDays - daysAhead).toFixed(1)));
        const hoursUntilExhausted = Math.round(daysUntilExhausted * 24);

        const targetBufferDays = 12;
        const targetStock = targetBufferDays * effectiveUsage;
        const suggestedReorderQty = Math.max(0, Math.ceil(targetStock - remainingStock));
        const reorderCostSAR = Math.round(suggestedReorderQty * item.unitPriceSAR);

        let urgencyLabel = "Healthy Buffer";
        if (status === "red") {
          urgencyLabel = daysUntilExhausted <= 1 ? "Depleted in <24h" : `Runs out in ${Math.floor(daysUntilExhausted)}d ${hoursUntilExhausted % 24}h`;
        } else if (status === "amber") {
          urgencyLabel = `Order in ${Math.max(1, Math.round(daysOfCoverLeft - item.leadTimeDays))}d`;
        }

        return {
          item,
          effectiveUsage,
          remainingStock,
          daysOfCoverLeft,
          effectiveThreshold,
          status,
          daysUntilExhausted,
          hoursUntilExhausted,
          suggestedReorderQty,
          reorderCostSAR,
          urgencyLabel,
          isOrderRequired: status === "red" || status === "amber"
        };
      });

      const ingMap = new Map();
      ingredients.forEach(i => ingMap.set(i.item.id, i));

      const dishes = UPCOMING_DISHES.map(dish => {
        const keyStatuses = dish.keyIngredientIds.map(id => ingMap.get(id)).filter(Boolean);
        const sortedByCover = [...keyStatuses].sort((a,b) => a.daysOfCoverLeft - b.daysOfCoverLeft);
        const weakest = sortedByCover[0] || ingredients[0];
        const hasRed = keyStatuses.some(k => k.status === "red");
        const hasAmber = keyStatuses.some(k => k.status === "amber");
        const overallStatus = hasRed ? "red" : (hasAmber ? "amber" : "green");

        let msg = "All ingredients stocked";
        if (overallStatus === "red") msg = `Blocked by: ${weakest.item.name} (${weakest.daysOfCoverLeft}d left)`;
        else if (overallStatus === "amber") msg = `Low stock on: ${weakest.item.name} (${weakest.daysOfCoverLeft}d left)`;

        return { dish, overallStatus, weakest, keyStatuses, canServeMessage: msg };
      });

      const supplierMap = new Map();
      ingredients.filter(i => i.isOrderRequired).forEach(i => {
        const sName = i.item.supplierName;
        if (!supplierMap.has(sName)) {
          supplierMap.set(sName, { supplierName: sName, leadTime: i.item.leadTimeDays, items: [], totalSAR: 0 });
        }
        const grp = supplierMap.get(sName);
        grp.items.push({ name: i.item.name, qty: i.suggestedReorderQty, unit: i.item.unit, cost: i.reorderCostSAR, status: i.status });
        grp.totalSAR += i.reorderCostSAR;
      });

      const supplierGroups = Array.from(supplierMap.values()).sort((a, b) => b.totalSAR - a.totalSAR);
      const totalBuySAR = supplierGroups.reduce((acc, g) => acc + g.totalSAR, 0);

      return {
        ingredients,
        dishes,
        supplierGroups,
        kpis: {
          itemsToBuyToday: ingredients.filter(i => i.status === "red").length,
          dishesAtRisk: dishes.filter(d => d.overallStatus !== "green").length,
          totalBuySAR,
          stockoutsAvoided: 14 + (whatIfs.delayDelivery3Days ? 6 : 0) + (whatIfs.extraWorkers200 ? 4 : 0)
        }
      };
    }

    // ========================================================================
    // 3D SKYLINE COMPONENT (THREE.JS)
    // ========================================================================
    function PantrySkyline3D({ ingredients, onSelect, selectedId }) {
      const containerRef = useRef(null);
      const ingRef = useRef(ingredients);
      ingRef.current = ingredients;
      const selRef = useRef(selectedId);
      selRef.current = selectedId;
      const [hovered, setHovered] = useState(null);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#0c2340");
        scene.fog = new THREE.FogExp2("#0c2340", 0.016);

        const width = container.clientWidth;
        const height = container.clientHeight;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 18, 36);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 4, 0);

        // Lights
        scene.add(new THREE.AmbientLight("#ffffff", 0.8));
        const dirLight = new THREE.DirectionalLight("#ffffff", 1.2);
        dirLight.position.set(15, 30, 20);
        scene.add(dirLight);

        // Floor Platform (Dark Royal Navy #08192e)
        const floorGeo = new THREE.CylinderGeometry(24, 25, 0.8, 48);
        const floorMat = new THREE.MeshStandardMaterial({ color: "#08192e", roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.4;
        scene.add(floor);

        const grid = new THREE.GridHelper(44, 44, "#fe932c", "#1e3a5f");
        grid.position.y = 0.02;
        scene.add(grid);

        // Floating Threshold Safety Plane (Amber #fe932c at y = 5.5)
        const planeGeo = new THREE.PlaneGeometry(36, 18);
        const planeMat = new THREE.MeshStandardMaterial({
          color: "#fe932c", transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false
        });
        const thresholdPlane = new THREE.Mesh(planeGeo, planeMat);
        thresholdPlane.rotation.x = Math.PI / 2;
        thresholdPlane.position.set(0, 5.5, 0);
        scene.add(thresholdPlane);

        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(planeGeo), new THREE.LineBasicMaterial({ color: "#fe932c" }));
        edges.rotation.x = Math.PI / 2;
        edges.position.set(0, 5.5, 0);
        scene.add(edges);

        // Towers
        const towers = new Map();
        const SPACING_X = 4.2;
        const SPACING_Z = 6.2;
        const START_X = -((7 - 1) * SPACING_X) / 2;
        const ROW_Z = [-SPACING_Z / 2, SPACING_Z / 2];

        ingRef.current.forEach((ing, idx) => {
          const row = Math.floor(idx / 7);
          const col = idx % 7;
          const px = START_X + col * SPACING_X;
          const pz = ROW_Z[row];

          // Base
          const base = new THREE.Mesh(
            new THREE.CylinderGeometry(1.5, 1.6, 0.3, 24),
            new THREE.MeshStandardMaterial({ color: "#1e293b" })
          );
          base.position.set(px, 0.15, pz);
          scene.add(base);

          // Tower Box
          const boxGeo = new THREE.BoxGeometry(2.0, 1, 2.0);
          boxGeo.translate(0, 0.5, 0);

          const boxMat = new THREE.MeshStandardMaterial({
            color: ing.status === "red" ? "#ef4444" : (ing.status === "amber" ? "#f59e0b" : "#10b981"),
            emissive: ing.status === "red" ? "#dc2626" : (ing.status === "amber" ? "#d97706" : "#059669"),
            emissiveIntensity: 0.35,
            roughness: 0.2
          });

          const mesh = new THREE.Mesh(boxGeo, boxMat);
          mesh.position.set(px, 0.3, pz);
          mesh.scale.y = Math.max(0.4, ing.daysOfCoverLeft * 1.1);
          mesh.userData = { id: ing.item.id };
          scene.add(mesh);

          towers.set(ing.item.id, { mesh, curH: mesh.scale.y });
        });

        // Raycasting
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-999, -999);

        const onMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);

          const meshes = Array.from(towers.values()).map(t => t.mesh);
          const hits = raycaster.intersectObjects(meshes);
          if (hits.length > 0) {
            const hitId = hits[0].object.userData.id;
            const item = ingRef.current.find(i => i.item.id === hitId);
            if (item) {
              setHovered({ item, x: e.clientX - rect.left, y: e.clientY - rect.top });
              container.style.cursor = "pointer";
              return;
            }
          }
          setHovered(null);
          container.style.cursor = "default";
        };

        const onClick = (e) => {
          const rect = container.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);

          const meshes = Array.from(towers.values()).map(t => t.mesh);
          const hits = raycaster.intersectObjects(meshes);
          if (hits.length > 0) {
            const hitId = hits[0].object.userData.id;
            const item = ingRef.current.find(i => i.item.id === hitId);
            if (item) onSelect(item);
          }
        };

        container.addEventListener("mousemove", onMouseMove);
        container.addEventListener("click", onClick);

        let reqId;
        const clock = new THREE.Clock();

        const loop = () => {
          reqId = requestAnimationFrame(loop);
          const time = clock.getElapsedTime();
          controls.update();

          ingRef.current.forEach(ing => {
            const entry = towers.get(ing.item.id);
            if (!entry) return;

            const targetH = Math.max(0.4, ing.daysOfCoverLeft * 1.1);
            entry.curH += (targetH - entry.curH) * 0.12;
            entry.mesh.scale.y = entry.curH;

            const mat = entry.mesh.material;
            let col = "#10b981";
            let emi = "#059669";
            let intensity = 0.35;

            if (ing.status === "red") {
              col = "#ef4444";
              emi = "#dc2626";
              intensity = 0.3 + 0.7 * Math.abs(Math.sin(time * 5.0)); // pulsating red!
            } else if (ing.status === "amber") {
              col = "#f59e0b";
              emi = "#d97706";
              intensity = 0.3 + 0.2 * Math.sin(time * 2.5);
            }

            mat.color.set(col);
            mat.emissive.set(emi);
            mat.emissiveIntensity = intensity;

            if (selRef.current === ing.item.id) {
              entry.mesh.scale.x = 1.15;
              entry.mesh.scale.z = 1.15;
            } else {
              entry.mesh.scale.x = 1.0;
              entry.mesh.scale.z = 1.0;
            }
          });

          renderer.render(scene, camera);
        };
        loop();

        return () => {
          cancelAnimationFrame(reqId);
          container.removeEventListener("mousemove", onMouseMove);
          container.removeEventListener("click", onClick);
          renderer.dispose();
          if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
        };
      }, []);

      return (
        <div className="relative w-full h-[480px] rounded-2xl overflow-hidden border border-cyan-500/20 bg-slate-950/80 shadow-2xl">
          <div ref={containerRef} className="w-full h-full" />
          
          <div className="absolute top-3 left-3 px-3 py-1.5 rounded-lg bg-slate-900/80 border border-cyan-500/30 text-xs font-mono text-cyan-300">
            3D PANTRY SKYLINE · ORBIT / CLICK TO INSPECT
          </div>

          <div className="absolute bottom-3 left-3 flex items-center gap-3 text-[11px] font-mono bg-slate-900/85 px-3 py-1.5 rounded-xl border border-white/10">
            <span className="flex items-center gap-1.5 text-emerald-400">● Optimal</span>
            <span className="flex items-center gap-1.5 text-amber-400">● Near Limit</span>
            <span className="flex items-center gap-1.5 text-rose-400 animate-pulse">● Below Threshold (Buy)</span>
            <span className="text-cyan-300">― 5d Threshold Plane</span>
          </div>

          {hovered && (
            <div
              className="pointer-events-none absolute z-20 px-3 py-2 rounded-xl bg-slate-900/90 border border-cyan-500/40 text-xs font-mono shadow-2xl"
              style={{ left: Math.min(hovered.x + 15, 600), top: Math.max(hovered.y - 70, 15) }}
            >
              <div className="font-bold text-white text-sm">{hovered.item.item.icon} {hovered.item.item.name}</div>
              <div className="text-cyan-300 font-bold">{hovered.item.daysOfCoverLeft} Days Cover</div>
              <div className="text-slate-400">Safety Limit: {hovered.item.effectiveThreshold} Days</div>
              <div className="text-slate-400">Burn: {hovered.item.effectiveUsage} {hovered.item.item.unit}/day</div>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // MAIN APP
    // ========================================================================
    function App() {
      const [daysAhead, setDaysAhead] = useState(0);
      const [whatIfs, setWhatIfs] = useState({ extraWorkers200: false, ramadanMode: false, delayDelivery3Days: false });
      const [viewMode, setViewMode] = useState("3D");
      const [selected, setSelected] = useState(null);
      const [isDemo, setIsDemo] = useState(false);
      const [demoStep, setDemoStep] = useState(0);

      const sim = useMemo(() => calculateSimulation(daysAhead, whatIfs), [daysAhead, whatIfs]);

      const demoSteps = [
        { t: "Step 1: 3D Skyline Overview", d: "14 core ingredients represented as towers where height = days of stock left.", fn: () => { setDaysAhead(0); setWhatIfs({ extraWorkers200: false, ramadanMode: false, delayDelivery3Days: false }); } },
        { t: "Step 2: Floating Threshold Plane", d: "Towers below the translucent cyan plane (Cooking Oil, Onions, Eggs) pulse in RED.", fn: () => {} },
        { t: "Step 3: Time Machine Slider", d: "Advancing to Day +4 forecasts stockout. Notice Basmati Rice & Chicken drop into danger.", fn: () => setDaysAhead(4) },
        { t: "Step 4: Stress Testing Delay", d: "Supplier delivery delayed by 3 days. Safety threshold expands, flagging 8 items.", fn: () => setWhatIfs(w => ({ ...w, delayDelivery3Days: true })) },
        { t: "Step 5: Dish Impact", d: "Menu items evaluate in real-time. 'Chicken Biryani' and 'Shakshuka' glow red and cannot be served.", fn: () => {} },
        { t: "Step 6: Smart Buy Requisition", d: "All at-risk ingredients auto-grouped by vendor with exact SAR cost. One-click Purchase.", fn: () => {} },
      ];

      useEffect(() => {
        if (!isDemo) return;
        demoSteps[demoStep]?.fn();
        const timer = setTimeout(() => {
          if (demoStep < demoSteps.length - 1) setDemoStep(s => s + 1);
          else setIsDemo(false);
        }, 6000);
        return () => clearTimeout(timer);
      }, [isDemo, demoStep]);

      return (
        <div className="max-w-[1550px] mx-auto p-4 md:p-6 space-y-5">
          {/* Dynamic Reports Top Ribbon */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 rounded-xl bg-[#0c2340] text-white shadow-sm">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xl">🥫</span>
                <h1 className="text-xl font-bold tracking-tight">Pantry Command Center</h1>
                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#fe932c]/20 text-[#fe932c] border border-[#fe932c]/30">
                  ✨ Food Stock Intelligence
                </span>
              </div>
              <p className="text-xs text-slate-300 mt-1">
                Tracks food stock in simple <strong>Days of Supply</strong> against safety limits. Visual 3D towers show what is safe, low, or needs urgent buying.
              </p>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={() => setViewMode(viewMode === "3D" ? "2D" : "3D")}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                  viewMode === "3D"
                    ? "bg-sky-400 text-slate-950 font-bold border border-sky-300"
                    : "bg-white/10 text-white hover:bg-white/20 border border-white/20"
                }`}
              >
                {viewMode === "3D" ? "← Switch to 2D Bar View" : "Switch to 3D View"}
              </button>

              {isDemo ? (
                <button
                  onClick={() => setIsDemo(false)}
                  className="px-3.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow-xs"
                >
                  ✕ Exit Tour
                </button>
              ) : (
                <button
                  onClick={() => { setDemoStep(0); setIsDemo(true); }}
                  className="px-3.5 py-1.5 rounded-lg bg-[#fe932c] hover:bg-[#e68222] text-slate-950 text-xs font-bold shadow-xs"
                >
                  ▶ Guided Demo Tour (3 Min)
                </button>
              )}
            </div>
          </div>

          {/* Layman KPI Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div className="p-4 rounded-xl border border-rose-500/30 bg-slate-900/60 shadow-sm">
              <span className="text-xs font-bold text-muted-foreground block text-slate-400">BUY TODAY</span>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-3xl font-black text-rose-500">{sim.kpis.itemsToBuyToday}</span>
                <span className="text-xs text-rose-400">items low</span>
              </div>
              <span className="text-[11px] text-slate-400 block mt-1">Below 5-day safety line: Oil, Onions, Eggs</span>
            </div>

            <div className="p-4 rounded-xl border border-amber-500/30 bg-slate-900/60 shadow-sm">
              <span className="text-xs font-bold text-muted-foreground block text-slate-400">MEALS AT RISK</span>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-3xl font-black text-amber-500">{sim.kpis.dishesAtRisk}</span>
                <span className="text-xs text-amber-400">of 10 planned</span>
              </div>
              <span className="text-[11px] text-slate-400 block mt-1">Dishes needing restocked ingredients</span>
            </div>

            <div className="p-4 rounded-xl border border-blue-500/30 bg-slate-900/60 shadow-sm">
              <span className="text-xs font-bold text-muted-foreground block text-slate-400">ESTIMATED REORDER COST</span>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-2xl font-black text-sky-400">SAR {sim.kpis.totalBuySAR.toLocaleString()}</span>
              </div>
              <span className="text-[11px] text-slate-400 block mt-1">Across {sim.supplierGroups.length} approved vendors</span>
            </div>

            <div className="p-4 rounded-xl border border-emerald-500/30 bg-slate-900/60 shadow-sm">
              <span className="text-xs font-bold text-muted-foreground block text-slate-400">AVERAGE FOOD SUPPLY</span>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-3xl font-black text-emerald-400">8.4</span>
                <span className="text-xs text-emerald-400">days overall</span>
              </div>
              <span className="text-[11px] text-slate-400 block mt-1">Healthy baseline for 1,000+ workers</span>
            </div>
          </div>

          {/* Controls: Time Machine & What-If Scenarios */}
          <div className="p-4 rounded-xl bg-slate-900/60 border border-slate-700/60 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-700/50 pb-2.5">
              <div>
                <span className="text-sm font-bold text-white block">📅 Forecast Food Supply Over Time</span>
                <span className="text-xs text-slate-400">Select a future day to see what food remains after daily meals are served.</span>
              </div>

              {/* Quick Jump Date Presets */}
              <div className="flex items-center gap-1.5 flex-wrap">
                <span className="text-xs text-slate-400 mr-1">Quick Jump:</span>
                {[
                  { label: "Today (Live)", days: 0 },
                  { label: "In 3 Days", days: 3 },
                  { label: "In 7 Days (1 Wk)", days: 7 },
                  { label: "In 14 Days (2 Wks)", days: 14 },
                ].map((preset) => (
                  <button
                    key={preset.days}
                    onClick={() => setDaysAhead(preset.days)}
                    className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${
                      daysAhead === preset.days
                        ? "bg-[#fe932c] text-slate-950 font-bold shadow-xs"
                        : "bg-slate-800 text-slate-300 hover:text-white"
                    }`}
                  >
                    {preset.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Slider */}
            <div className="space-y-1">
              <div className="flex justify-between text-xs">
                <span className="text-slate-300 font-semibold">
                  Timeline: <span className="text-[#fe932c] font-bold">{daysAhead === 0 ? "Today" : `Day +${daysAhead}`}</span>
                </span>
                <span className="text-slate-400">{daysAhead === 0 ? "Current physical kitchen stock" : `${daysAhead} days of kitchen consumption deducted`}</span>
              </div>
              <input
                type="range"
                min="0"
                max="14"
                value={daysAhead}
                onChange={e => setDaysAhead(Number(e.target.value))}
                className="w-full h-2 bg-slate-800 rounded-lg cursor-pointer accent-[#fe932c]"
              />
              <div className="flex justify-between text-[11px] text-slate-500">
                <span>Today</span>
                <span>Day +3</span>
                <span>Day +7 (Week 1)</span>
                <span>Day +10</span>
                <span>Day +14 (Week 2)</span>
              </div>
            </div>

            {/* What-If Scenarios */}
            <div className="pt-2 border-t border-slate-700/50 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
              <span className="text-xs font-semibold text-slate-300">✨ What-If Scenarios (Test Operational Changes):</span>
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={() => setWhatIfs(w => ({ ...w, extraWorkers200: !w.extraWorkers200 }))}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all ${
                    whatIfs.extraWorkers200 ? "bg-sky-500/20 text-sky-300 border-sky-400 font-bold" : "bg-slate-800 text-slate-400 border-slate-700"
                  }`}
                >
                  👥 +200 Workers (+20% More Food)
                </button>
                <button
                  onClick={() => setWhatIfs(w => ({ ...w, ramadanMode: !w.ramadanMode }))}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all ${
                    whatIfs.ramadanMode ? "bg-amber-500/20 text-amber-300 border-amber-400 font-bold" : "bg-slate-800 text-slate-400 border-slate-700"
                  }`}
                >
                  🌙 Ramadan Meals
                </button>
                <button
                  onClick={() => setWhatIfs(w => ({ ...w, delayDelivery3Days: !w.delayDelivery3Days }))}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all ${
                    whatIfs.delayDelivery3Days ? "bg-rose-500/20 text-rose-300 border-rose-400 font-bold" : "bg-slate-800 text-slate-400 border-slate-700"
                  }`}
                >
                  🚚 Delivery Delayed 3 Days
                </button>
              </div>
            </div>
          </div>

          {/* Visualizer & Side Card */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
            <div className={selected ? "lg:col-span-8" : "lg:col-span-12"}>
              {viewMode === "3D" ? (
                <PantrySkyline3D ingredients={sim.ingredients} onSelect={setSelected} selectedId={selected?.item.id} />
              ) : (
                <div className="p-4 rounded-xl bg-slate-900/60 border border-slate-700/60 grid grid-cols-1 md:grid-cols-2 gap-3">
                  {sim.ingredients.map(ing => (
                    <div
                      key={ing.item.id}
                      onClick={() => setSelected(ing)}
                      className={`p-3 rounded-xl border cursor-pointer transition-all ${
                        ing.status === "red"
                          ? "border-rose-500/40 bg-rose-500/10"
                          : ing.status === "amber"
                          ? "border-amber-500/40 bg-amber-500/10"
                          : "border-slate-700/60 bg-slate-800/40 hover:bg-slate-800"
                      }`}
                    >
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-white text-sm">{ing.item.icon} {ing.item.name}</span>
                        <span className={`font-bold ${ing.status === "red" ? "text-rose-400" : (ing.status === "amber" ? "text-amber-400" : "text-emerald-400")}`}>
                          {ing.daysOfCoverLeft} Days of Food
                        </span>
                      </div>
                      <div className="text-[11px] text-slate-400 mt-1 flex justify-between">
                        <span>Stock: {ing.remainingStock} {ing.item.unit}</span>
                        <span>Safety Line: {ing.effectiveThreshold}d</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {selected && (
              <div className="lg:col-span-4 p-4 rounded-xl bg-slate-900 border border-[#fe932c]/50 space-y-3 text-xs shadow-xl animate-in fade-in">
                <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                  <span className="font-bold text-white text-sm">{selected.item.icon} {selected.item.name}</span>
                  <button onClick={() => setSelected(null)} className="text-slate-400 hover:text-white p-1">✕</button>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center">
                  <div className="p-2.5 rounded-lg bg-slate-800 border border-slate-700">
                    <span className="text-[10px] text-slate-400 uppercase font-bold block">Food Remaining</span>
                    <span className="text-xl font-bold text-amber-400">{selected.daysOfCoverLeft} Days</span>
                  </div>
                  <div className="p-2.5 rounded-lg bg-slate-800 border border-slate-700">
                    <span className="text-[10px] text-slate-400 uppercase font-bold block">Safety Line</span>
                    <span className="text-xl font-bold text-slate-200">{selected.effectiveThreshold} Days</span>
                  </div>
                </div>
                <div className="text-slate-300 space-y-1.5 text-xs">
                  <div className="flex justify-between"><span>Supplier:</span> <strong className="text-white">{selected.item.supplierName}</strong></div>
                  <div className="flex justify-between"><span>Lead Time:</span> <strong className="text-white">{selected.item.leadTimeDays} days</strong></div>
                  <div className="flex justify-between"><span>Suggested Order:</span> <strong className="text-emerald-400">{selected.suggestedReorderQty} {selected.item.unit}</strong></div>
                  <div className="flex justify-between"><span>Est. Reorder Cost:</span> <strong className="text-sky-300">SAR {selected.reorderCostSAR.toLocaleString()}</strong></div>
                  <div className="text-rose-400 font-bold pt-1">{selected.urgencyLabel}</div>
                </div>
                <button
                  onClick={() => setSelected(null)}
                  className="w-full py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs hover:bg-slate-700"
                >
                  Close Details
                </button>
              </div>
            )}
          </div>

          {/* Upcoming Menu Dish Health */}
          <div className="p-4 rounded-xl bg-slate-900/60 border border-slate-700/60 space-y-3">
            <div className="flex items-center justify-between border-b border-slate-700/50 pb-2">
              <div>
                <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                  <span>🍽️ Upcoming Menu Dishes & Meal Availability</span>
                </h3>
                <p className="text-xs text-slate-400">Will the kitchen have enough food to prepare these scheduled meals?</p>
              </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
              {sim.dishes.map(dh => (
                <div
                  key={dh.dish.id}
                  className={`p-3 rounded-xl border transition-all ${
                    dh.overallStatus === "red"
                      ? "border-rose-500/40 bg-rose-500/10"
                      : dh.overallStatus === "amber"
                      ? "border-amber-500/40 bg-amber-500/10"
                      : "border-slate-700/60 bg-slate-800/40 hover:bg-slate-800"
                  }`}
                >
                  <div className="flex justify-between items-start">
                    <span className="text-[10px] uppercase font-bold text-slate-400">{dh.dish.scheduledDay} · {dh.dish.mealSession}</span>
                    <span className={`w-3 h-3 rounded-full shrink-0 ${dh.overallStatus === "red" ? "bg-rose-500" : (dh.overallStatus === "amber" ? "bg-amber-500" : "bg-emerald-500")}`} />
                  </div>
                  <h4 className="text-xs font-bold text-white mt-1">{dh.dish.name}</h4>
                  <p className="text-[11px] text-slate-400 mt-0.5">{dh.dish.portions} portions planned</p>
                  <div className={`text-[11px] mt-2 truncate ${dh.overallStatus === "red" ? "text-rose-400 font-bold" : (dh.overallStatus === "amber" ? "text-amber-400 font-medium" : "text-emerald-400")}`}>
                    {dh.canServeMessage}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Smart Reorder Buy List */}
          <div className="p-4 md:p-5 rounded-xl bg-slate-900/60 border border-slate-700/60 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-700/50 pb-3">
              <div>
                <h3 className="text-sm font-bold text-white flex items-center gap-2">
                  <span>🛒 Suggested Reorder List</span>
                  <span className="text-[10px] text-emerald-300 px-2 py-0.5 bg-emerald-500/20 border border-emerald-500/30 rounded font-semibold">AUTO-GROUPED BY SUPPLIER</span>
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">Ingredients falling near or below the safety line are collected here with recommended quantities.</p>
              </div>
              <button
                onClick={() => alert(`PO-2026-ARAMCO-${Math.floor(1000 + Math.random() * 9000)} dispatched to ${sim.supplierGroups.length} vendors! Total: SAR ${sim.kpis.totalBuySAR.toLocaleString()}`)}
                className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs transition-colors"
              >
                Send to Purchase (SAR {sim.kpis.totalBuySAR.toLocaleString()})
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {sim.supplierGroups.map(grp => (
                <div key={grp.supplierName} className="p-3.5 rounded-xl bg-slate-800/50 border border-slate-700/60 text-xs space-y-2">
                  <div className="flex justify-between items-center text-white font-bold pb-1.5 border-b border-slate-700/40">
                    <span>{grp.supplierName} ({grp.leadTime}d delivery)</span>
                    <span className="text-[#fe932c] font-bold font-mono">SAR {grp.totalSAR.toLocaleString()}</span>
                  </div>
                  {grp.items.map((it, idx) => (
                    <div key={idx} className="flex justify-between items-center text-slate-300 text-xs">
                      <span className="flex items-center gap-1.5">
                        <span className={`w-2 h-2 rounded-full ${it.status === "red" ? "bg-rose-500" : "bg-amber-500"}`} />
                        {it.name} ({it.qty} {it.unit})
                      </span>
                      <span className="text-white font-mono font-semibold">SAR {it.cost.toLocaleString()}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>

          {/* Demo Subtitle Banner */}
          {isDemo && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-[650px] p-4 rounded-xl bg-[#0c2340] border-2 border-[#fe932c] shadow-2xl text-white text-xs">
              <div className="flex justify-between items-center text-[#fe932c] font-bold mb-1.5">
                <span>{demoSteps[demoStep]?.t}</span>
                <button onClick={() => setIsDemo(false)} className="text-rose-400 hover:text-white px-2 py-0.5 rounded bg-white/10">✕ Exit Tour</button>
              </div>
              <p className="text-slate-100 text-sm">{demoSteps[demoStep]?.d}</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
